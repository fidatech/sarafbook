name: Diagnose

# Requests one address from the server and prints the newest application errors (shortened).

on:
  workflow_dispatch:
    inputs:
      url:
        description: Addresses to request first, separated by spaces (optional)
      errors:
        description: How many of the newest errors to show
        default: '3'
      smoke:
        description: Short name of a Sarafi whose pages should be opened as its administrator (optional)
      paths:
        description: Paths to open for it, separated by spaces (default the pages of the menu)

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
      PROD_SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      CHECK_URL: ${{ inputs.url }}
      ERRORS: ${{ inputs.errors }}
      SMOKE_TENANT: ${{ inputs.smoke }}
      SMOKE_PATHS: ${{ inputs.paths }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        shell: bash
        run: bash scripts/deploy/ssh-setup.sh
      - name: Read the newest errors
        shell: bash
        run: |
          set -Eeuo pipefail
          {
            for name in CHECK_URL ERRORS SMOKE_TENANT SMOKE_PATHS; do printf 'export %s=%q\n' "$name" "${!name}"; done
            cat scripts/deploy/cpanel-diagnose.sh
          } | ssh production 'bash -s'
