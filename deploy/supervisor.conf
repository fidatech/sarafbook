; One queue worker pool for every Sarafi: each job carries the Sarafi it belongs to.
[program:sarafbook-queue]
command=php /srv/sarafbook/current/artisan queue:work --sleep=1 --tries=3 --timeout=120 --max-time=3600
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
user=www-data
stopwaitsecs=130
stdout_logfile=/var/log/sarafbook-queue.log
redirect_stderr=true
