# SarafBook on one VPS: every Sarafi address and the platform address point here.
# Replace sarafbook.af and the paths; issue a wildcard certificate for *.sarafbook.af
# (Let's Encrypt, DNS challenge) and a certificate for each own domain of a Sarafi.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name sarafbook.af *.sarafbook.af;

    ssl_certificate     /etc/letsencrypt/live/sarafbook.af/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sarafbook.af/privkey.pem;

    # the "current" link is switched to a new release folder on each deploy
    root /srv/sarafbook/current/public;
    index index.php;
    charset utf-8;
    client_max_body_size 12m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/manifest+json;
    # with the brotli module:  brotli on; brotli_types <the same list>;

    # static files carry ?v=<time changed>: keep them for a year
    location ~* \.(?:css|js|woff2?|svg|webp|png|jpe?g|avif|ico|webmanifest)$ {
        try_files $uri /index.php?$query_string;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ /\.(?!well-known).* { deny all; }
}

# A Sarafi pinned to its own version (see docs/TENANT-CHANGES.md, level 3): the same block with
#   server_name pinned-sarafi.sarafbook.af;   root /srv/sarafbook/releases/tenant-<name>/public;
# placed above the wildcard block.
